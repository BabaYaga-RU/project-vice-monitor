name: Collect YouTube video metrics

on:
  schedule:
    - cron: '43 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: macca-youtube-metrics
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Check optional Analytics authorization
        id: auth
        env:
          ANALYTICS_REFRESH_TOKEN: ${{ secrets.YOUTUBE_ANALYTICS_REFRESH_TOKEN }}
        run: |
          if [[ -n "$ANALYTICS_REFRESH_TOKEN" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Analytics collection is disabled; the existing upload token is unchanged."
          fi
      - uses: actions/setup-python@v5
        if: steps.auth.outputs.configured == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-youtube.txt
      - name: Install YouTube Analytics dependencies
        if: steps.auth.outputs.configured == 'true'
        run: python -m pip install -r requirements-youtube.txt
      - name: Collect due 6h, 24h, and 72h snapshots
        if: steps.auth.outputs.configured == 'true'
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_ANALYTICS_REFRESH_TOKEN: ${{ secrets.YOUTUBE_ANALYTICS_REFRESH_TOKEN }}
          YOUTUBE_PUBLISHED_FILE: blog/youtube-published.json
          YOUTUBE_METRICS_FILE: blog/youtube-metrics.json
        run: python scripts/youtube_metrics.py
      - name: Commit collected metrics
        if: steps.auth.outputs.configured == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog/youtube-metrics.json
          if git diff --cached --quiet; then
            echo "No new YouTube metrics to save."
          else
            git commit -m "Collect YouTube video analytics"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
