name: Uptime Monitor

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  uptime-monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Maintenance Window
        run: |
          CURRENT_TIME=$(date -u -d "-3 hours" +"%H%M")
          DATE_SEED=$(date -u -d "-3 hours" +"%Y%m%d")
          
          RANDOM_OFFSET=$(echo "$DATE_SEED" | awk '{print ($1 % 60)}')
          
          STOP_LIMIT=$(( 2235 + RANDOM_OFFSET ))
          START_LIMIT=$(( 0600 + RANDOM_OFFSET ))
          
          echo "Current: $CURRENT_TIME | Today's Stop: $STOP_LIMIT | Today's Start: $START_LIMIT"
          
          if [ "$CURRENT_TIME" -ge "$STOP_LIMIT" ] || [ "$CURRENT_TIME" -lt "$START_LIMIT" ]; then
            echo "Outside of operational window."
            exit 0
          fi

      - name: Provision Resources
        run: |
          SEC=$(( ( RANDOM % 900 )  + 600 ))
          sleep $SEC

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
        
      - name: Install dependencies
        run: pip install requests --quiet
          
      - name: Run internal metrics
        id: monitor
        run: |
          python monitor.py
          echo "MONITOR_EXIT_CODE=$?" >> $GITHUB_ENV

      - name: Asset Optimization
        run: sleep $(( ( RANDOM % 300 )  + 300 ))
          
      - name: Build static assets
        run: python generate_static_blog.py
          
      - name: Sync branches
        id: changes
        run: |
          if git diff --exit-code history.json index.html uptime-badge.json blog.html blog/*.html; then
            echo "CHANGES=false" >> $GITHUB_OUTPUT
          else
            echo "CHANGES=true" >> $GITHUB_OUTPUT
          fi
          
      - name: Commit changes
        if: steps.changes.outputs.CHANGES == 'true'
        env:
          GH_TOKEN: ${{ secrets.PAT_SHARK }}
        run: |
          git config user.name "BabaYaga-RU"
          git config user.email "p201952589703@gmail.com"
          
          # Criar branch nova a partir da main limpa
          NEW_BRANCH="patch-$(openssl rand -hex 4)"
          echo "SRE_BRANCH=$NEW_BRANCH" >> $GITHUB_ENV
          
          # Stash das mudanças do monitor para não perder no checkout
          git add .
          git stash
          
          git fetch origin main
          git checkout -b $NEW_BRANCH origin/main
          
          # Aplica as mudanças de volta na branch nova
          git stash pop || true
          git add .
          
          MESSAGES=("docs: update monitoring logs" "feat: refresh dashboard data" "chore: sync system metrics" "fix: update uptime status")
          RANDOM_MSG=${MESSAGES[$(( RANDOM % ${#MESSAGES[@]} ))]}
          
          git commit -m "$RANDOM_MSG"
          
          # Força o push usando o PAT na URL para garantir acesso
          git push https://x-access-token:${{ secrets.PAT_SHARK }}@github.com/${{ github.repository }}.git $NEW_BRANCH --force

      - name: System Integration Test
        if: steps.changes.outputs.CHANGES == 'true'
        run: |
          SEC=$(( ( RANDOM % 1200 )  + 900 ))
          sleep $SEC

      - name: Merge updates
        if: steps.changes.outputs.CHANGES == 'true'
        env:
          GH_TOKEN: ${{ secrets.PAT_SHARK }}
        run: |
          PR_TITLE="SRE: System Metrics Update $(date +'%H:%M')"
          
          # Cria o PR
          PR_URL=$(gh pr create --title "$PR_TITLE" --body "Synchronization of observability metrics." --base main --head ${{ env.SRE_BRANCH }})
          
          sleep $(( ( RANDOM % 60 ) + 30 ))
          
          # Merge forçado ignorando restrições de admin
          gh pr merge "$PR_URL" --squash --delete-branch --admin
