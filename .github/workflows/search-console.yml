name: Collect Search Console growth signals

on:
  schedule:
    - cron: '41 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: macca-search-console
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect Search Console query/page signals
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          SEARCH_CONSOLE_REFRESH_TOKEN: ${{ secrets.SEARCH_CONSOLE_REFRESH_TOKEN }}
          YOUTUBE_ANALYTICS_REFRESH_TOKEN: ${{ secrets.YOUTUBE_ANALYTICS_REFRESH_TOKEN }}
          SEARCH_CONSOLE_SITE_URL: https://macca-lab.onrender.com/
        run: python -m scripts.search_console
      - name: Save Search Console feedback
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -f blog/search-console.json ]]; then git add blog/search-console.json; fi
          if git diff --cached --quiet; then
            echo "No Search Console update to save."
          else
            git commit -m "Collect Search Console growth signals"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
