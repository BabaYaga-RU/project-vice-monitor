name: Macca Blog Publisher

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gta-blog.yml'
      - 'scripts/blog.mjs'
      - 'scripts/instagram.mjs'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      retroactive_backfill:
        description: Search the last 21 days and generate a retroactive batch
        type: boolean
        default: false
      posts_to_generate:
        description: Maximum articles (up to 50 when retroactive backfill is enabled)
        type: choice
        options: ['1', '3', '5', '10', '25', '50']
        default: '1'

permissions:
  contents: write

concurrency:
  group: macca-blog-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Scan feeds for new GTA or Rockstar coverage without AI
        id: monitor
        if: github.event_name == 'schedule'
        env:
          CANDIDATE_FILE: ${{ runner.temp }}/macca-blog-candidate.json
        run: node scripts/blog.mjs monitor
      - name: Initialize Instagram article queue
        if: github.event_name != 'schedule' || steps.monitor.outputs.should_generate == 'true'
        env:
          INSTAGRAM_QUEUE_FILE: ${{ runner.temp }}/macca-instagram-queue.json
        run: echo '[]' > "$INSTAGRAM_QUEUE_FILE"
      - name: Research and generate an article when a novel sourced topic exists
        id: ai_generation
        if: github.event_name != 'schedule' || steps.monitor.outputs.should_generate == 'true'
        continue-on-error: true
        env:
          SITE_URL: https://macca-lab.onrender.com
          CANDIDATE_FILE: ${{ runner.temp }}/macca-blog-candidate.json
          MAX_POSTS_PER_RUN: ${{ github.event.inputs.posts_to_generate || '1' }}
          INSTAGRAM_QUEUE_FILE: ${{ runner.temp }}/macca-instagram-queue.json
          BACKFILL_FLAG: ${{ github.event.inputs.retroactive_backfill == 'true' && '--backfill' || '' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: node scripts/blog.mjs generate ${BACKFILL_FLAG} --count=${MAX_POSTS_PER_RUN}
      - name: Record a retry cooldown when scheduled generation fails
        id: record_failure
        if: github.event_name == 'schedule' && steps.monitor.outputs.should_generate == 'true' && steps.ai_generation.outcome == 'failure'
        env:
          CANDIDATE_FILE: ${{ runner.temp }}/macca-blog-candidate.json
        run: node scripts/blog.mjs record-monitor-failure
      - name: Build all blog indexes, feeds and sitemaps
        id: build_blog
        if: github.event_name != 'schedule' || (steps.monitor.outputs.should_generate == 'true' && steps.ai_generation.outcome == 'success')
        env:
          SITE_URL: https://macca-lab.onrender.com
        run: node scripts/blog.mjs build
      - name: Build whole-site SEO metadata and discovery files
        id: build_seo
        if: github.event_name != 'schedule' || (steps.monitor.outputs.should_generate == 'true' && steps.ai_generation.outcome == 'success')
        env:
          SITE_URL: https://macca-lab.onrender.com
        run: node scripts/build-seo.mjs
      - name: Install ImageMagick for branded Instagram artwork
        if: (github.event_name != 'schedule' || (steps.monitor.outputs.should_generate == 'true' && steps.ai_generation.outcome == 'success')) && steps.build_blog.outcome == 'success'
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick fonts-dejavu-core
      - name: Create a square Instagram image for each new story
        id: prepare_instagram
        if: (github.event_name != 'schedule' || (steps.monitor.outputs.should_generate == 'true' && steps.ai_generation.outcome == 'success')) && steps.build_blog.outcome == 'success' && steps.build_seo.outcome == 'success'
        env:
          SITE_URL: https://macca-lab.onrender.com
          INSTAGRAM_QUEUE_FILE: ${{ runner.temp }}/macca-instagram-queue.json
        run: node scripts/instagram.mjs prepare
      - name: Commit and push generated changes
        if: always() && ((steps.build_blog.outcome == 'success' && steps.build_seo.outcome == 'success' && steps.prepare_instagram.outcome == 'success' && (github.event_name != 'schedule' || steps.monitor.outputs.should_generate == 'true')) || steps.record_failure.outcome == 'success')
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Build blog artwork and whole-site SEO"
            git push origin HEAD:main
          else
            echo "No blog changes to publish."
          fi
      - name: Publish new stories to Instagram
        id: instagram_publish
        if: (github.event_name != 'schedule' || (steps.monitor.outputs.should_generate == 'true' && steps.ai_generation.outcome == 'success')) && steps.prepare_instagram.outcome == 'success' && steps.build_blog.outcome == 'success' && steps.build_seo.outcome == 'success'
        env:
          SITE_URL: https://macca-lab.onrender.com
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_QUEUE_FILE: ${{ runner.temp }}/macca-instagram-queue.json
        run: node scripts/instagram.mjs publish
      - name: Save Instagram publication IDs
        if: always() && steps.instagram_publish.outcome != 'skipped' && hashFiles('blog/instagram-published.json') != ''
        run: |
          git add blog/instagram-published.json
          if git diff --cached --quiet; then
            echo "No new Instagram publication records."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Record Instagram blog publications"
            git push origin HEAD:main
          fi
