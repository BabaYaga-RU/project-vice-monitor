name: Configure Cloudflare Web Analytics

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/web-analytics.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Create or reuse the free Cloudflare Web Analytics site
        env:
          CLOUDFLARE_WEB_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_WEB_ANALYTICS_TOKEN }}
          CLOUDFLARE_WORKERS_DEPLOY_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_DEPLOY_TOKEN }}
          CLOUDFLARE_FALLBACK_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ANALYTICS_HOST: macca-lab.onrender.com
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const token = process.env.CLOUDFLARE_WEB_ANALYTICS_TOKEN || process.env.CLOUDFLARE_FALLBACK_API_TOKEN || process.env.CLOUDFLARE_WORKERS_DEPLOY_TOKEN || '';
          const account = process.env.CLOUDFLARE_ACCOUNT_ID || '';
          const host = process.env.ANALYTICS_HOST;
          if (!token || !account) {
            console.log('Cloudflare credentials unavailable; Web Analytics setup remains pending.');
            process.exit(0);
          }
          const headers = {authorization:`Bearer ${token}`, 'content-type':'application/json'};
          const base = `https://api.cloudflare.com/client/v4/accounts/${account}/rum/site_info`;
          let site = null;
          try {
            const response = await fetch(`${base}/list?per_page=50`, {headers});
            const payload = await response.json();
            if (response.ok && payload.success) {
              site = (payload.result || []).find(item =>
                (item.rules || []).some(rule => rule.host === host) ||
                item.ruleset?.zone_name === host
              ) || null;
            }
          } catch {}
          if (!site) {
            const response = await fetch(base, {
              method:'POST', headers,
              body:JSON.stringify({auto_install:false, host}),
            });
            const payload = await response.json().catch(() => ({}));
            if (!response.ok || !payload.success) {
              console.log('Cloudflare Web Analytics could not be created with the current token permissions. The site keeps working without it.');
              process.exit(0);
            }
            site = payload.result;
          }
          if (!site?.site_token) {
            console.log('Cloudflare Web Analytics site exists but did not return a site token.');
            process.exit(0);
          }
          fs.mkdirSync('analytics', {recursive:true});
          fs.writeFileSync('analytics/web-analytics.json', JSON.stringify({
            provider:'cloudflare-web-analytics',
            host,
            token:site.site_token,
          }, null, 2) + '\n');
          console.log(`Cloudflare Web Analytics configured for ${host}.`);
          NODE
      - name: Save analytics site token
        run: |
          if [[ ! -f analytics/web-analytics.json ]]; then
            echo "No Web Analytics configuration was created."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analytics/web-analytics.json
          if git diff --cached --quiet; then
            echo "Web Analytics configuration is unchanged."
          else
            git commit -m "Configure Cloudflare Web Analytics"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
